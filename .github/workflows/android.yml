name: Android CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Verify model exists
        run: |
          echo "Checking assets folder..."
          ls -lh app/src/main/assets/
          if [ ! -f app/src/main/assets/best_float16.tflite ]; then
            echo "ERROR: best_float16.tflite not found!"
            exit 1
          fi
          echo "✅ Model file found successfully!"

      # 🧹 پاک کردن cache قدیمی Gradle (حل مشکل sourceSetPathMap)
      - name: Clean old Gradle caches
        run: |
          echo "🧹 Cleaning old Gradle caches..."
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/daemon/
          rm -rf .gradle/
          rm -rf app/build/
          echo "✅ Old caches removed"

      # ⚙️ نصب Gradle بدون cache (موقت برای build تمیز)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Grant execute permission
        run: chmod +x gradlew

      # 🏗️ ساخت APK با build تمیز (no cache, rerun all tasks)
      - name: Build Debug APK (clean build)
        run: |
          echo "🏗️ Starting clean build..."
          ./gradlew clean
          ./gradlew assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            --info
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # 📤 آپلود لاگ در صورت خطا (برای دیباگ)
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 3
